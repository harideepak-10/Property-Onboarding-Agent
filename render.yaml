# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
# Creates the PostgreSQL database, the Django API (web service) and the React app (static site).
databases:
  - name: property-onboarding-db
    plan: free            # free Postgres expires after 30 days; switch to basic-256mb for anything lasting
    databaseName: onboarding
    user: onboarding

services:
  - type: web
    name: property-onboarding-api
    runtime: python
    plan: free            # free instances sleep after 15 min idle and have no persistent disk
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: bash start.sh
    healthCheckPath: /admin/login/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: property-onboarding-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: SERVE_MEDIA
        value: "true"
      - key: SEED_DEMO
        value: "true"     # loads the 5 demo properties on start; set to false for real client data
      - key: DEMO_PASSWORD
        generateValue: true   # password for the "ops" login; see it under Environment in the dashboard
      - key: PRICE_CHECKER
        value: simulated
      # The static site's address, e.g. https://property-onboarding-web.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Fill these in when the client shares credentials (blank = dry-run mode)
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GUESTY_CLIENT_ID
        sync: false
      - key: GUESTY_CLIENT_SECRET
        sync: false
      - key: ANGEL_HOST_EMAIL
        sync: false
      - key: OPS_EMAIL
        sync: false
    # For uploads that survive deploys, use plan: starter and uncomment:
    # disk:
    #   name: media
    #   mountPath: /var/data
    #   sizeGB: 1
    # and add the env var MEDIA_ROOT=/var/data/media

  - type: web
    name: property-onboarding-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "20"
      # The API's address + /api, e.g. https://property-onboarding-api.onrender.com/api
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

